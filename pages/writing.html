            <header>

              <h2 id="flowers-will-bloom-title">Flowers will bloom</h2>
            </header>
            <blockquote>
              <span>I carry you in each breath,</span>
              <span>Every dawn that finds us apart.</span>
              <span>I’m here</span>
              <span>My dearest love.</span>
              <span>Within the pain, I vow:</span>
              <span>All the flowers will bloom.</span>
            </blockquote>
          </article>
